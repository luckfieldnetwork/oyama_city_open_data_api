services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: oyama_city_opendata_api
    # FastAPI立ち上げのコマンド
    working_dir: /app/v1.0
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - ROOT_PATH=/v1.0
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/v1.0
      - OYAMA_DB_PATH=/db/oyama_opendata.db
    volumes:
      - ./api:/app
      - ../scraping/db:/db:ro
    ports:
      - "8000:8000"

  nginx:
    # 軽量なAlpineベースのNginx
    image: nginx:alpine
    container_name: oyama_city_opendata_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

volumes:
  db_data:
