server {
    listen 80;
    server_name localhost;

    # アップロードファイルサイズの上限（デフォルト1MBを20MBに変更）
    client_max_body_size 20M;

    # API v1.0 へのリバースプロキシ
    location /v1.0/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /v1.0;
    }

    # 互換性用: /api/v1.0/ へのリバースプロキシ
    location /api/v1.0/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api/v1.0;
    }

    # /api/ へのアクセスは /v1.0/ へリダイレクト
    location /api/ {
        rewrite ^/api/(.*)$ /v1.0/$1 permanent;
    }
}
